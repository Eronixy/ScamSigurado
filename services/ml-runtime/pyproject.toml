[project]
name = "scamsigurado-ml-runtime"
version = "0.1.0"
description = "Private ML and OCR inference runtime for ScamSigurado"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "numpy>=2.0,<3",
    "opencv-python-headless>=4.10,<5",
    "pillow>=10,<12",
    "pydantic-settings>=2.6,<3",
    "pytesseract>=0.3.13,<1",
    "python-multipart>=0.0.18,<1",
    "scikit-learn==1.6.1",
    "tensorflow==2.19.0",
    "uvicorn[standard]>=0.30,<1",
]

[tool.uv]
package = false
